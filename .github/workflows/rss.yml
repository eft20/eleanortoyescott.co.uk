name: Check RSS feed
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/generate-feed.py --check
